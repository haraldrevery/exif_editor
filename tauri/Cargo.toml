[package]
name    = "revery-exif"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

# Binary + library split: the ExifTool session layer and the write path are in
# src/lib.rs so `cargo test` can exercise them without a running Tauri app.
# main.rs is only wiring.
[lib]
name = "revery_exif_core"
path = "src/lib.rs"

[[bin]]
name = "revery-exif"
path = "src/main.rs"

# The same core, exposed as a JSON-lines service for the Electron shell, which
# cannot link the library directly. See src/serve.rs for why this exists rather
# than a Node reimplementation.
[[bin]]
name = "revery-exif-core"
path = "src/serve.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri               = { version = "2", features = ["protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde               = { version = "1", features = ["derive"] }
serde_json          = "1"
# Thumbnail cache keys (src/thumbcache.rs) and the vendored-binary integrity
# check.
sha2                = "0.10"
base64              = "0.22"
# GPX is XML. Read-only DOM, no unsafe, no transitive dependencies — the
# smallest thing that correctly handles namespaces and entities, which a
# hand-rolled scan for <trkpt> tags would not.
roxmltree           = "0.20"
# Drops Windows' `\\?\` prefix from canonicalised paths. See library::canonical
# for why that prefix is not something this app can hand to ExifTool. No-op on
# Unix; no transitive dependencies.
dunce               = "1.0"

[profile.release]
opt-level = "s"
lto       = "thin"
panic     = "abort"
